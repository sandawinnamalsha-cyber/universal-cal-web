name: Build Flet Web

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Flet
        run: pip install "flet==0.28.3"
      - name: Build Web
        run: flet build web --verbose
      - name: Upload Website
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: build/web
